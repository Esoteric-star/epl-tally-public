{% extends "base.html" %}
{% from "_macros.html" import player_avatar %}
{% block body %}
<div class="who">
  <div class="gate__bar"><span class="brand"><span class="brand__tag">PL</span><span class="brand__word">Predictor</span></span></div>
  <div class="who__body">
    <div>
      <h2 class="gate__h">Who are you?</h2>
      <p class="gate__p">Tap your name to carry on.</p>
    </div>
    <form method="post" action="{{ url_for('who') }}">
      <div class="who__list">
        {% for p in players %}
        <button class="whocard" type="submit" name="player" value="{{ p.name }}">
          {{ player_avatar(p.name) }}
          <span>
            <span class="whocard__name">{{ p.name }}</span>
            <span class="whocard__meta">{{ p.position }}{{ 'st' if p.position == 1 else 'nd' if p.position == 2 else 'rd' if p.position == 3 else 'th' }} · {{ p.exact }} exact score{{ '' if p.exact == 1 else 's' }}</span>
          </span>
          <span class="whocard__pts"><b>{{ p.points }}</b><span>pts</span></span>
        </button>
        {% endfor %}
      </div>
    </form>
  </div>
</div>
{% endblock %}
